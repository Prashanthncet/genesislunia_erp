<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 430" width="1140" height="430" role="img" aria-label="Module map — 13 modules across five groups">
  <title>Module map</title>
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2040"/><stop offset="100%" stop-color="#081428"/>
    </linearGradient>
    <linearGradient id="mCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122e57" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d2040" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="mSh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
    <filter id="mGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    /* transform-only: cards stay legible even if animations are frozen */
    @keyframes pop { from{transform:translateY(12px) scale(.98)} to{transform:none} }
    @keyframes beat{ 0%,100%{opacity:.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.3)} }
    @keyframes shim{ 0%{background-position:-160% 0} 100%{background-position:260% 0} }
    .m{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .mono{font-family:"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .card{filter:url(#mSh)}
    .dot{animation:beat 2.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .shine{animation:shim 5s linear infinite}
    @media (prefers-reduced-motion: reduce){ .card,.dot,.shine{animation:none} }
  </style>

  <rect width="1140" height="430" rx="18" fill="url(#mBg)"/>

  <text class="m" x="46" y="52" font-size="21" font-weight="800" fill="#eef4fb">13 modules · 5 groups</text>
  <text class="m" x="46" y="75" font-size="12.5" fill="#86addc">Every card below is a live, tested feature — not a roadmap item.</text>
  <rect x="46" y="90" width="1048" height="1" fill="#2f66b3" fill-opacity="0.4"/>

  <!-- Group 1: Academics -->
  <text class="m" x="46" y="122" font-size="11" font-weight="700" letter-spacing="2.2" fill="#f9a03f">ACADEMICS</text>
  <g class="card" style="animation:pop .6s .05s both">
    <rect x="46" y="134" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#2f66b3" stroke-opacity="0.65"/>
    <circle class="dot" cx="70" cy="156" r="4.5" fill="#2f66b3"/>
    <text class="m" x="86" y="161" font-size="14" font-weight="700" fill="#eef4fb">Students</text>
    <text class="m" x="70" y="180" font-size="10.5" fill="#86addc">master record · roll nos</text>
  </g>
  <g class="card" style="animation:pop .6s .12s both">
    <rect x="256" y="134" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#2f66b3" stroke-opacity="0.65"/>
    <circle class="dot" cx="280" cy="156" r="4.5" fill="#2f66b3" style="animation-delay:-.4s"/>
    <text class="m" x="296" y="161" font-size="14" font-weight="700" fill="#eef4fb">Admissions</text>
    <text class="m" x="280" y="180" font-size="10.5" fill="#86addc">9-step workflow · tokens</text>
  </g>
  <g class="card" style="animation:pop .6s .19s both">
    <rect x="466" y="134" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#2f66b3" stroke-opacity="0.65"/>
    <circle class="dot" cx="490" cy="156" r="4.5" fill="#2f66b3" style="animation-delay:-.8s"/>
    <text class="m" x="506" y="161" font-size="14" font-weight="700" fill="#eef4fb">Academics</text>
    <text class="m" x="490" y="180" font-size="10.5" fill="#86addc">syllabus · lesson plans</text>
  </g>
  <g class="card" style="animation:pop .6s .26s both">
    <rect x="676" y="134" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#2f66b3" stroke-opacity="0.65"/>
    <circle class="dot" cx="700" cy="156" r="4.5" fill="#2f66b3" style="animation-delay:-1.2s"/>
    <text class="m" x="716" y="161" font-size="14" font-weight="700" fill="#eef4fb">Timetable</text>
    <text class="m" x="700" y="180" font-size="10.5" fill="#86addc">CSP generator · substitutes</text>
  </g>
  <g class="card" style="animation:pop .6s .33s both">
    <rect x="886" y="134" width="208" height="60" rx="13" fill="url(#mCard)" stroke="#2f66b3" stroke-opacity="0.65"/>
    <circle class="dot" cx="910" cy="156" r="4.5" fill="#2f66b3" style="animation-delay:-1.6s"/>
    <text class="m" x="926" y="161" font-size="14" font-weight="700" fill="#eef4fb">Exam Ledger</text>
    <text class="m" x="910" y="180" font-size="10.5" fill="#86addc">CBSE report cards</text>
  </g>
  <g class="card" style="animation:pop .6s .40s both">
    <rect x="46" y="202" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#2f66b3" stroke-opacity="0.65"/>
    <circle class="dot" cx="70" cy="224" r="4.5" fill="#2f66b3" style="animation-delay:-2s"/>
    <text class="m" x="86" y="229" font-size="14" font-weight="700" fill="#eef4fb">CBT Tests</text>
    <text class="m" x="70" y="248" font-size="10.5" fill="#86addc">timed · auto-graded</text>
  </g>

  <!-- Group 2: Operations -->
  <text class="m" x="286" y="222" font-size="11" font-weight="700" letter-spacing="2.2" fill="#0d7d76">OPERATIONS</text>
  <g class="card" style="animation:pop .6s .47s both">
    <rect x="286" y="234" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#0d7d76" stroke-opacity="0.7"/>
    <circle class="dot" cx="310" cy="256" r="4.5" fill="#0d7d76" style="animation-delay:-.5s"/>
    <text class="m" x="326" y="261" font-size="14" font-weight="700" fill="#eef4fb">Attendance</text>
    <text class="m" x="310" y="280" font-size="10.5" fill="#86addc">batch mark · register</text>
  </g>
  <g class="card" style="animation:pop .6s .54s both">
    <rect x="496" y="234" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#0d7d76" stroke-opacity="0.7"/>
    <circle class="dot" cx="520" cy="256" r="4.5" fill="#0d7d76" style="animation-delay:-.9s"/>
    <text class="m" x="536" y="261" font-size="14" font-weight="700" fill="#eef4fb">Fees</text>
    <text class="m" x="520" y="280" font-size="10.5" fill="#86addc">invoices · receipts</text>
  </g>
  <g class="card" style="animation:pop .6s .61s both">
    <rect x="706" y="234" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#0d7d76" stroke-opacity="0.7"/>
    <circle class="dot" cx="730" cy="256" r="4.5" fill="#0d7d76" style="animation-delay:-1.3s"/>
    <text class="m" x="746" y="261" font-size="14" font-weight="700" fill="#eef4fb">Leaves &amp; Passes</text>
    <text class="m" x="730" y="280" font-size="10.5" fill="#86addc">OTP gate passes</text>
  </g>
  <g class="card" style="animation:pop .6s .68s both">
    <rect x="916" y="234" width="178" height="60" rx="13" fill="url(#mCard)" stroke="#0d7d76" stroke-opacity="0.7"/>
    <circle class="dot" cx="940" cy="256" r="4.5" fill="#0d7d76" style="animation-delay:-1.7s"/>
    <text class="m" x="956" y="261" font-size="14" font-weight="700" fill="#eef4fb">Hostel</text>
    <text class="m" x="940" y="280" font-size="10.5" fill="#86addc">rooms · visitors</text>
  </g>

  <!-- Group 3: People & Safety -->
  <text class="m" x="46" y="330" font-size="11" font-weight="700" letter-spacing="2.2" fill="#f43f5e">PEOPLE &amp; SAFETY</text>
  <g class="card" style="animation:pop .6s .75s both">
    <rect x="46" y="342" width="290" height="60" rx="13" fill="url(#mCard)" stroke="#f43f5e" stroke-opacity="0.55"/>
    <circle class="dot" cx="70" cy="364" r="4.5" fill="#f43f5e" style="animation-delay:-.6s"/>
    <text class="m" x="86" y="369" font-size="14" font-weight="700" fill="#eef4fb">Staff &amp; Payroll</text>
    <text class="m" x="70" y="388" font-size="10.5" fill="#86addc">structures · payslips · leave-deduction</text>
  </g>
  <g class="card" style="animation:pop .6s .82s both">
    <rect x="346" y="342" width="290" height="60" rx="13" fill="url(#mCard)" stroke="#f43f5e" stroke-opacity="0.55"/>
    <circle class="dot" cx="370" cy="364" r="4.5" fill="#f43f5e" style="animation-delay:-1s"/>
    <text class="m" x="386" y="369" font-size="14" font-weight="700" fill="#eef4fb">Discipline</text>
    <text class="m" x="370" y="388" font-size="10.5" fill="#86addc">incidents · audit trail</text>
  </g>

  <!-- Group 4: Insights -->
  <text class="m" x="676" y="330" font-size="11" font-weight="700" letter-spacing="2.2" fill="#8b5cf6">INSIGHTS</text>
  <g class="card" style="animation:pop .6s .89s both">
    <rect x="676" y="342" width="200" height="60" rx="13" fill="url(#mCard)" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <circle class="dot" cx="700" cy="364" r="4.5" fill="#8b5cf6" style="animation-delay:-1.4s"/>
    <text class="m" x="716" y="369" font-size="14" font-weight="700" fill="#eef4fb">Reports</text>
    <text class="m" x="700" y="388" font-size="10.5" fill="#86addc">analytics · CSV export</text>
  </g>
  <g class="card" style="animation:pop .6s .96s both">
    <rect x="886" y="342" width="208" height="60" rx="13" fill="url(#mCard)" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <circle class="dot" cx="910" cy="364" r="4.5" fill="#8b5cf6" style="animation-delay:-1.8s"/>
    <text class="m" x="926" y="369" font-size="14" font-weight="700" fill="#eef4fb">Notifications</text>
    <text class="m" x="910" y="388" font-size="10.5" fill="#86addc">outbound SMS / email log</text>
  </g>
</svg>