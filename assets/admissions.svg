<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 210" width="1140" height="210" role="img" aria-label="Nine-step admissions pipeline">
  <title>Admissions — 9-step workflow</title>
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="tok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9a03f"/><stop offset="100%" stop-color="#2f66b3"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b5cfeb"/><stop offset="100%" stop-color="#2f66b3"/>
    </linearGradient>
    <filter id="pSh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0d2040" flood-opacity="0.14"/>
    </filter>
    <filter id="tokGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes travel{ 0%{offset-distance:0%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{offset-distance:100%;opacity:0} }
    /* transform-only: steps stay legible even if animations are frozen */
    @keyframes step{ from{transform:translateY(10px)} to{transform:none} }
    @keyframes rail{ 0%,100%{opacity:.45} 50%{opacity:1} }
    .m{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
    .tok{offset-path:path("M70 120 L1070 120"); animation:travel 7s linear infinite}
    .rail{animation:rail 4s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){ .tok,.rail{animation:none} }
  </style>

  <rect width="1140" height="210" rx="16" fill="url(#pBg)"/>
  <text class="m" x="40" y="42" font-size="17" font-weight="800" fill="#0f172a">Admissions · 9-step workflow</text>
  <text class="m" x="40" y="62" font-size="12" fill="#64748b">Parent link → student created. Each step is a separate, guarded endpoint.</text>

  <!-- rail -->
  <rect class="rail" x="70" y="118" width="1000" height="4" rx="2" fill="url(#rail)"/>

  <!-- travelling token -->
  <g class="tok"><circle r="9" fill="url(#tok)" filter="url(#tokGlow)"/></g>

  <!-- steps: 9 evenly across 70..1070 -->
  <g class="m" text-anchor="middle">
    <!-- 1 -->
    <g style="animation:step .5s .05s both">
      <circle cx="70" cy="120" r="13" fill="#fff" stroke="#2f66b3" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="70" y="124" font-size="11" font-weight="800" fill="#2f66b3">1</text>
      <text x="70" y="150" font-size="11" font-weight="700" fill="#1e293b">Link</text>
      <text x="70" y="165" font-size="9.5" fill="#64748b">AO → parent</text>
    </g>
    <!-- 2 -->
    <g style="animation:step .5s .13s both">
      <circle cx="195" cy="120" r="13" fill="#fff" stroke="#2f66b3" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="195" y="124" font-size="11" font-weight="800" fill="#2f66b3">2</text>
      <text x="195" y="150" font-size="11" font-weight="700" fill="#1e293b">Submit</text>
      <text x="195" y="165" font-size="9.5" fill="#64748b">parent form</text>
    </g>
    <!-- 3 -->
    <g style="animation:step .5s .21s both">
      <circle cx="320" cy="120" r="13" fill="#fff" stroke="#2f66b3" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="320" y="124" font-size="11" font-weight="800" fill="#2f66b3">3</text>
      <text x="320" y="150" font-size="11" font-weight="700" fill="#1e293b">Validate</text>
      <text x="320" y="165" font-size="9.5" fill="#64748b">docs · OS</text>
    </g>
    <!-- 4 -->
    <g style="animation:step .5s .29s both">
      <circle cx="445" cy="120" r="13" fill="#fff" stroke="#2f66b3" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="445" y="124" font-size="11" font-weight="800" fill="#2f66b3">4</text>
      <text x="445" y="150" font-size="11" font-weight="700" fill="#1e293b">Pay fee</text>
      <text x="445" y="165" font-size="9.5" fill="#64748b">accounts</text>
    </g>
    <!-- 5 -->
    <g style="animation:step .5s .37s both">
      <circle cx="570" cy="120" r="13" fill="#fff" stroke="#2f66b3" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="570" y="124" font-size="11" font-weight="800" fill="#2f66b3">5</text>
      <text x="570" y="150" font-size="11" font-weight="700" fill="#1e293b">Allocate</text>
      <text x="570" y="165" font-size="9.5" fill="#64748b">roll no</text>
    </g>
    <!-- 6 -->
    <g style="animation:step .5s .45s both">
      <circle cx="695" cy="120" r="13" fill="#fff" stroke="#f9a03f" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="695" y="124" font-size="11" font-weight="800" fill="#b45814">6</text>
      <text x="695" y="150" font-size="11" font-weight="700" fill="#1e293b">VP</text>
      <text x="695" y="165" font-size="9.5" fill="#64748b">approve</text>
    </g>
    <!-- 7 -->
    <g style="animation:step .5s .53s both">
      <circle cx="820" cy="120" r="13" fill="#fff" stroke="#f9a03f" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="820" y="124" font-size="11" font-weight="800" fill="#b45814">7</text>
      <text x="820" y="150" font-size="11" font-weight="700" fill="#1e293b">Principal</text>
      <text x="820" y="165" font-size="9.5" fill="#64748b">approve</text>
    </g>
    <!-- 8 -->
    <g style="animation:step .5s .61s both">
      <circle cx="945" cy="120" r="13" fill="#fff" stroke="#0d7d76" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="945" y="124" font-size="11" font-weight="800" fill="#0d7d76">8</text>
      <text x="945" y="150" font-size="11" font-weight="700" fill="#1e293b">Student</text>
      <text x="945" y="165" font-size="9.5" fill="#64748b">record</text>
    </g>
    <!-- 9 -->
    <g style="animation:step .5s .69s both">
      <circle cx="1070" cy="120" r="13" fill="#0d7d76" stroke="#0d7d76" stroke-width="2.4" filter="url(#pSh)"/>
      <text x="1070" y="124" font-size="11" font-weight="800" fill="#fff">9</text>
      <text x="1070" y="150" font-size="11" font-weight="700" fill="#0f766e">Letter</text>
      <text x="1070" y="165" font-size="9.5" fill="#64748b">printable</text>
    </g>
  </g>
</svg>