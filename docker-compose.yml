# Single-host production-style stack: API + web, SQLite on a named volume,
# nightly backups into ./backups. For multi-server / AWS see docs/OPERATIONS.md.
#   JWT_SECRET=$(openssl rand -hex 48) PUBLIC_URL=https://erp.school.edu docker compose up -d --build
services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/erp.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:5173}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:5173}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Optional Redis (shared report cache + cross-instance rate limits). Uncomment the
      # redis service below and set REDIS_URL=redis://redis:6379 to use it.
      REDIS_URL: ${REDIS_URL:-}
      # Notification drivers per channel (unset channel = logged as "mocked").
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      MSG91_BODY_VAR: ${MSG91_BODY_VAR:-message}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TZ_SCHOOL: ${TZ_SCHOOL:-Asia/Kolkata}
      # Error alerting (Sentry + generic JSON webhook, de-duplicated per 5 min).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Documents: S3 / Cloudflare R2 when STORAGE_DRIVER=s3, else the data volume (single server only).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /data/storage
      STORAGE_ALLOW_LOCAL: "1"
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    # depends_on:
    #   - redis
    volumes:
      - erp-data:/data
      - ./backups:/backups
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:3001
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
  backup:
    # Daily online backup with 14-day retention (scripts/backup-db.js).
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/erp.db
      BACKUP_DIR: /backups
      BACKUP_KEEP: "14"
      # Off-site copy: set BACKUP_S3_BUCKET (+ S3_* below) to upload every snapshot.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_KEEP_REMOTE: ${BACKUP_KEEP_REMOTE:-30}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    volumes:
      - erp-data:/data
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do node scripts/backup-db.js; sleep 86400; done"]
volumes:
  erp-data:
