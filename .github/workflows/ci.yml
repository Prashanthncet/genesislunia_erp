name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: Migrations match schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url file:./shadow.db --exit-code
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest
      - run: npx jest --config test/jest-e2e.json --runInBand
      - run: npx nest build
      - name: Postgres schema is generated from the SQLite schema (no drift)
        run: node scripts/make-postgres-schema.js --check

  backend-postgres:
    # The same e2e suite against real PostgreSQL (the plan's production database).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      E2E_PG_ADMIN_URL: postgresql://erp:erp@localhost:5432/postgres
      DATABASE_URL: postgresql://erp:erp@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate --schema prisma/postgres/schema.prisma
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest --config test/jest-e2e.json --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
